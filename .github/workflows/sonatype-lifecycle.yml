name: Sonatype Lifecycle

# Open source / SCA analysis with Sonatype Lifecycle, with the policy violations
# published into the GitHub Security tab next to the Fortify SAST alerts.
#
# Deliberately NOT triggered on every pull request: the repository carries a
# batch of Aviator remediation PRs that do not touch dependencies, and each
# would otherwise queue a full evaluation. Dependency changes still get their
# own run through the paths filter below.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - pom.xml
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sca:
    name: Sonatype-Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # clm-maven-plugin:index writes target/sonatype-clm/module.xml, which
      # carries the exact Maven relationships. Scanning it together with the
      # built jar is what gives Lifecycle both the dependency tree and the
      # binary evidence -- the jar alone would only let it reconstruct the
      # graph from Maven Central.
      - name: Build and index dependencies
        run: |
          mvn -B -ntp -DskipTests package
          mvn -B -ntp com.sonatype.clm:clm-maven-plugin:index

      - name: Sonatype Lifecycle evaluation
        id: evaluate
        uses: sonatype/actions/evaluate@v1
        with:
          iq-server-url: ${{ secrets.SONATYPE_IQ_URL }}
          username: ${{ secrets.SONATYPE_IQ_USER }}
          password: ${{ secrets.SONATYPE_IQ_PASSWORD }}
          application-id: clinical-trial-portal
          stage: develop
          scan-targets: target/sonatype-clm/module.xml target/iwa.jar
          sarif-file: sonatype.sarif
          # Uploaded further down instead, after aggregation and link scrubbing.
          upload-sarif-file: false

      # The evaluate action emits one SARIF result per policy violation, which
      # would bury the Fortify alerts. This collapses them to one alert per
      # component, carrying the full CVE list.
      #
      # --public-links is mandatory here: this repository is public, and the
      # Lifecycle deep links embed the IQ hostname. The script fails the job if
      # any trace of that hostname survives into the uploaded file.
      - name: Aggregate and scrub SARIF
        if: ${{ always() && hashFiles('sonatype.sarif') != '' }}
        run: |
          python3 .github/scripts/aggregate-sonatype-sarif.py \
            sonatype.sarif sonatype-aggregated.sarif --public-links

      - name: Upload SARIF to GitHub code scanning
        if: ${{ always() && hashFiles('sonatype-aggregated.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sonatype-aggregated.sarif
          category: sonatype-lifecycle
